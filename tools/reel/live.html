<!doctype html>
<!--
  Teaser 2's overlay (F, 2026-11-19: "Warsaw 3 a.m." in the website's pixel font, and then "only
  Warsaw 3 a.m., nothing else"): a transparent 1080x1920 layer over the game footage, the words
  typed in at the bottom of Instagram's safe area (x 60-960, y 250-1500), a soft shade under them.
  tools/reel/render.mjs --live-frames=SECONDS calls window.frame(t) per frame.
-->
<html>
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: "Pixel"; src: url(fonts/pixelify-latin.woff2) format("woff2"); font-weight: 400 700; }
html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
#stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; font-family: "Pixel", monospace; color: #fff; }
.abs { position: absolute; }
#shade { left: 0; top: 0; width: 1080px; height: 1920px; background: linear-gradient(180deg, rgba(8,6,24,0) 50%, rgba(8,6,24,0.6) 100%); }
#title { left: 64px; top: 1360px; font-size: 76px; font-weight: 500; line-height: 1.0; color: rgba(255,255,255,0.82); text-shadow: 0 2px 6px rgba(0,0,0,0.6); white-space: pre; }
#title .cur { display: inline-block; width: 0.5em; height: 0.1em; background: rgba(255,255,255,0.82); margin-left: 0.08em; }
</style>
</head>
<body>
<div id="stage">
  <div class="abs" id="shade"></div>
  <div class="abs" id="title"></div>
</div>
<script>
const P = new URLSearchParams(location.search);
const TEXT = "Warsaw\n3 a.m.";
const $ = (id) => document.getElementById(id);
const k = (t, a, b) => Math.min(1, Math.max(0, (t - a) / (b - a)));
function frame(t) {
  // "Warsaw 3 a.m." typed in from 1.0 s, a letter every 0.11 s (calm, F), the cursor blinking after.
  const n = Math.max(0, Math.min(TEXT.length, Math.floor((t - 1.0) / 0.11)));
  const cur = (n < TEXT.length || Math.floor(t * 2.5) % 2 === 0) ? '<span class="cur"></span>' : "";
  $("title").innerHTML = TEXT.slice(0, n).replace("\n", "<br>") + cur;
}
window.frame = frame;
frame(+(P.get("t") || 2.5));
</script>
</body>
</html>
