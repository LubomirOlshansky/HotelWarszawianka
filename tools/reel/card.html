<!doctype html>
<!--
  Around Warsaw's logo, background and Reels end card in the look of the game's own title screen
  (F, 2026-11-19: "I like how my loading screen looks"): game/shaders/title.gdshader ported to
  WebGL 2 (dusk sky, striped sun, the Palace skyline, the neon grid), title.gd's palm, and the chrome
  wordmark (chrome.gdshader's gradient, Open Sans like Godot's default font, sheared and outlined
  like title.gd). No image generator: every shape is here. tools/reel/render.mjs loads this page
  with ?mode=card|bg|square|wordmark|wordmark2&w=&h= and calls window.frame(t) per frame.
-->
<html>
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: "Title Sans"; src: url(fonts/opensans-800-latin.woff2) format("woff2"); font-weight: 800; }
@font-face { font-family: "Title Sans"; src: url(fonts/opensans-600-latin.woff2) format("woff2"); font-weight: 600; }
@font-face { font-family: "Mr Dafoe"; src: url(fonts/mrdafoe.woff2) format("woff2"); }
@font-face { font-family: "Yellowtail"; src: url(fonts/yellowtail.woff2) format("woff2"); }
@font-face { font-family: "Audiowide"; src: url(fonts/audiowide.woff2) format("woff2"); }
@font-face { font-family: "Russo One"; src: url(fonts/russoone.woff2) format("woff2"); }
@font-face { font-family: "Orbitron"; src: url(fonts/orbitron.woff2) format("woff2"); font-weight: 900; }
html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
#stage { position: relative; overflow: hidden; }
#stage > canvas, #stage > svg { position: absolute; left: 0; top: 0; display: block; }
.plate { position: absolute; display: flex; flex-direction: row; align-items: center; justify-content: center; gap: 22px;
  background: rgba(20, 5, 46, 0.84); border: 3px solid #7ff6ff; border-radius: 4px; font-family: var(--ui, "Title Sans"), sans-serif; }
.plate b { font-weight: var(--ui-weight, 800); font-size: 52px; color: #7ff6ff; letter-spacing: 0.02em; }
.plate.android b { color: #a4e86b; }
.plate.ios svg { width: 40px; height: 64px; }
.plate.android svg { width: 78px; height: 49px; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="gl"></canvas>
  <canvas id="palm"></canvas>
  <svg id="text" xmlns="http://www.w3.org/2000/svg"></svg>
  <!-- F 2026-11-19: just the platforms, an icon each. iOS: a plain iPhone outline (Apple's logo is not
       for third-party art); Android: the Android robot's head (Google, CC BY 3.0). -->
  <div class="plate ios" id="ios"><svg viewBox="0 0 40 64"><rect x="3" y="2" width="34" height="60" rx="8" fill="none" stroke="#7ff6ff" stroke-width="4"/><rect x="14" y="6" width="12" height="3" rx="1.5" fill="#7ff6ff"/><rect x="13" y="54" width="14" height="3" rx="1.5" fill="#7ff6ff"/></svg><b>iOS</b></div>
  <div class="plate android" id="android"><svg viewBox="0 0 64 40"><path d="M6 38 A26 26 0 0 1 58 38 Z" fill="#a4e86b"/><line x1="16" y1="8" x2="10" y2="1" stroke="#a4e86b" stroke-width="3" stroke-linecap="round"/><line x1="48" y1="8" x2="54" y2="1" stroke="#a4e86b" stroke-width="3" stroke-linecap="round"/><circle cx="21" cy="25" r="3" fill="#14052e"/><circle cx="43" cy="25" r="3" fill="#14052e"/></svg><b>Android</b></div>
</div>
<script>
const P = new URLSearchParams(location.search);
const MODE = P.get("mode") || "card";   // card | bg | square | wordmark (one line) | wordmark2 (two lines)
const W = +(P.get("w") || 1080), H = +(P.get("h") || 1920);
// The lettering (F, 2026-11-19 round 3: "change the fonts to more stylish"): "neon" is the outrun
// look, a pink neon script over chrome block capitals; "open" is the first draft's Open Sans.
const STYLES = {
  open: { block: "Title Sans", weight: 800, ui: "Title Sans", uiWeight: 800 },
  neon: { script: "Mr Dafoe", block: "Russo One", weight: 400, ui: "Audiowide", uiWeight: 400 },
  tail: { script: "Yellowtail", block: "Audiowide", weight: 400, ui: "Audiowide", uiWeight: 400 },
  orbit: { block: "Orbitron", weight: 900, ui: "Orbitron", uiWeight: 900 },
};
const ST = STYLES[P.get("style") || "neon"];
document.documentElement.style.setProperty("--ui", `"${ST.ui}"`);
document.documentElement.style.setProperty("--ui-weight", ST.uiWeight);
const TEXT_ONLY = MODE.startsWith("wordmark");
const stage = document.getElementById("stage");
stage.style.width = W + "px"; stage.style.height = H + "px";

// Layout per mode. S scales the skyline and the sun about the horizon (in screen heights, as the
// shader draws them): a portrait screen is only 0.56 heights wide, so the scene shrinks to keep
// Varso and the towers in. Every word of the card sits inside Instagram's Reels safe area
// (y 250-1500, x 60-960).
const L = {
  card:   { hz: 0.6, S: 0.5, palm: 0.44 },
  bg:     { hz: 0.6, S: 0.5, palm: 0.44 },
  square: { hz: 0.72, S: 0.62, palm: 0.5 },
}[MODE] || { hz: 0.64, S: 1, palm: 0 };

// --- The backdrop: title.gdshader, line for line, plus the scale S.
const FRAG = `#version 300 es
precision highp float;
uniform vec2 res; uniform float aspect; uniform float horizon; uniform float S; uniform float TIME;
out vec4 outc;
const vec3 INDIGO = vec3(0.035, 0.02, 0.11);
const vec3 PURPLE = vec3(0.2, 0.06, 0.36);
const vec3 MAGENTA = vec3(0.78, 0.16, 0.55);
const vec3 ORANGE = vec3(1.0, 0.5, 0.36);
const vec3 SUN_TOP = vec3(1.0, 0.9, 0.42);
const vec3 SUN_BOTTOM = vec3(1.0, 0.24, 0.62);
const vec3 SILHOUETTE = vec3(0.09, 0.03, 0.17);
const vec3 GRID = vec3(1.0, 0.2, 0.75);
float hash(vec2 p) { vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
float box(vec2 p, float x0, float x1, float top, float hz) { return step(x0, p.x) * step(p.x, x1) * step(hz - top, p.y); }
float skyline(vec2 p, float hz) {
  float s = 0.0; float cx = 0.03; float x = p.x - cx; float k = 0.00146; float kw = 0.0021;
  s = max(s, box(vec2(x, p.y), -133.0 * kw, 133.0 * kw, 18.0 * k, hz));
  for (int i = 0; i < 2; i++) {
    float side = i == 0 ? -1.0 : 1.0; vec2 q = vec2(x * side, p.y);
    s = max(s, box(q, 70.0 * kw, 121.0 * kw, 24.0 * k, hz));
    s = max(s, box(q, 44.0 * kw, 68.0 * kw, 30.0 * k, hz));
    s = max(s, box(q, 0.0, 36.0 * kw, 67.0 * k, hz));
    s = max(s, box(q, 21.5 * kw, 30.5 * kw, 73.0 * k, hz));
    s = max(s, box(q, 24.9 * kw, 27.1 * kw, 82.0 * k, hz));
    s = max(s, box(q, 33.6 * kw, 35.2 * kw, 74.0 * k, hz));
    s = max(s, box(q, 0.0, 22.0 * kw, 139.0 * k, hz));
    s = max(s, box(q, 17.8 * kw, 21.2 * kw, 153.0 * k, hz));
    s = max(s, box(q, 0.0, 12.5 * kw, 143.0 * k, hz));
    s = max(s, box(q, 0.0, 8.5 * kw, 168.0 * k, hz));
    s = max(s, box(q, 6.5 * kw, 8.3 * kw, 177.0 * k, hz));
    s = max(s, box(q, 0.0, 6.3 * kw, 188.0 * k, hz));
    for (int j = 0; j < 3; j++) { float px = 66.0 + float(j) * 26.0; s = max(s, box(q, (px - 0.8) * kw, (px + 0.8) * kw, 28.0 * k, hz)); }
  }
  float up = (hz - p.y) / k;
  if (up > 188.0 && up < 203.0 && abs(x) < mix(6.0, 2.4, (up - 188.0) / 15.0) * kw) s = 1.0;
  if (up >= 200.0 && up < 237.0 && abs(x) < mix(1.8, 0.15, (up - 200.0) / 37.0) * kw + 0.0012) s = 1.0;
  s = max(s, box(p, -0.52, -0.46, 0.25, hz));
  if (p.x > -0.493 && p.x < -0.487 && p.y > hz - 0.34) s = 1.0;
  s = max(s, box(p, -0.43, -0.37, 0.15, hz)); s = max(s, box(p, -0.36, -0.3, 0.19, hz));
  s = max(s, box(p, -0.3, -0.22, 0.09, hz)); s = max(s, box(p, 0.25, 0.32, 0.17, hz));
  s = max(s, box(p, 0.33, 0.37, 0.12, hz)); s = max(s, box(p, 0.38, 0.46, 0.21, hz));
  s = max(s, box(p, 0.47, 0.55, 0.08, hz)); s = max(s, box(p, -0.75, -0.55, 0.05, hz));
  s = max(s, box(p, 0.56, 0.8, 0.04, hz));
  return s;
}
void main() {
  vec2 uv = vec2(gl_FragCoord.x / res.x, 1.0 - gl_FragCoord.y / res.y);
  float hz = horizon;
  vec2 p = vec2((uv.x - 0.5) * aspect, uv.y);
  vec2 ps = vec2(p.x / S, hz - (hz - p.y) / S);   // the scene's own coordinates
  vec3 col;
  if (uv.y < hz) {
    float t = uv.y / hz;
    col = mix(INDIGO, PURPLE, smoothstep(0.0, 0.55, t));
    col = mix(col, MAGENTA, smoothstep(0.5, 0.85, t));
    col = mix(col, ORANGE, smoothstep(0.86, 1.0, t));
    vec2 cell = floor(uv * vec2(aspect, 1.0) * 180.0 * res.y / 1170.0);
    float h = hash(cell);
    if (h > 0.996 && t < 0.55) col += vec3(0.9, 0.85, 1.0) * (0.5 + 0.5 * sin(TIME * 2.0 + h * 50.0)) * (1.0 - t / 0.55);
    vec2 c = vec2(0.03, hz - 0.25); float r = 0.235; float d = length(ps - c);
    col += vec3(1.0, 0.3, 0.6) * exp(-max(d - r, 0.0) * 7.0) * 0.3;
    if (d < r) {
      float k = (ps.y - c.y) / r;
      vec3 sun = mix(SUN_TOP, SUN_BOTTOM, smoothstep(-0.9, 0.9, k));
      bool gap = false;
      if (k > -0.1) { float band = fract(k * 5.0 - TIME * 0.22); gap = band < mix(0.06, 0.5, (k + 0.1) / 1.1); }
      if (!gap) col = sun;
    }
    if (skyline(ps, hz) > 0.5) col = SILHOUETTE * (0.8 + 0.5 * t);
  } else {
    float t = (uv.y - hz) / (1.0 - hz);
    col = mix(vec3(0.13, 0.03, 0.22), vec3(0.02, 0.0, 0.05), smoothstep(0.0, 1.0, t));
    float z = 1.0 / max(t, 0.002);
    float wx = (uv.x - 0.5) * aspect / S * z * 2.2;
    float wz = z * 0.9 + TIME * 1.4;
    float lx = (0.5 - abs(fract(wx) - 0.5)) / max(fwidth(wx), 1e-5);
    float lz = (0.5 - abs(fract(wz) - 0.5)) / max(fwidth(wz), 1e-5);
    float line = max(1.0 - smoothstep(0.0, 1.4 * res.y / 1170.0, lx), 1.0 - smoothstep(0.0, 1.4 * res.y / 1170.0, lz));
    float fade = smoothstep(0.0, 0.25, t);
    col += GRID * line * fade;
    col += GRID * 0.12 * line * (1.0 - fade);
    col += MAGENTA * exp(-t * 9.0) * 0.55;
  }
  col += vec3(1.0, 0.55, 0.8) * exp(-abs(uv.y - hz) * 260.0) * 0.8;
  outc = vec4(col, 1.0);
}`;

const glc = document.getElementById("gl");
glc.width = W; glc.height = H;
let gl = null, uTime = null;
if (!TEXT_ONLY) {
  gl = glc.getContext("webgl2", { preserveDrawingBuffer: true, antialias: true });
  const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; };
  const prog = gl.createProgram();
  gl.attachShader(prog, sh(gl.VERTEX_SHADER, `#version 300 es
in vec2 a; void main() { gl_Position = vec4(a, 0.0, 1.0); }`));
  gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FRAG));
  gl.linkProgram(prog); gl.useProgram(prog);
  const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, "a"); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  gl.viewport(0, 0, W, H);
  gl.uniform2f(gl.getUniformLocation(prog, "res"), W, H);
  gl.uniform1f(gl.getUniformLocation(prog, "aspect"), W / H);
  gl.uniform1f(gl.getUniformLocation(prog, "horizon"), L.hz);
  gl.uniform1f(gl.getUniformLocation(prog, "S"), L.S);
  uTime = gl.getUniformLocation(prog, "TIME");
} else glc.remove();

// --- The palm: title.gd's _draw_palm, on a 2D canvas.
const pc = document.getElementById("palm");
pc.width = W; pc.height = H;
function bez(a, b, c, t) { const l = (p, q, s) => [p[0] + (q[0] - p[0]) * s, p[1] + (q[1] - p[1]) * s]; return l(l(a, b, t), l(b, c, t), t); }
function drawPalm() {
  if (!L.palm) { pc.remove(); return; }
  const g = pc.getContext("2d");
  const height = H * L.palm;
  const base = [W * 0.0, H * 1.02];
  const top = [base[0] + height * 0.2, base[1] - height];
  const bend = [base[0] - height * 0.04, base[1] - height * 0.55];
  const px = Math.max(H / 720, 1);
  const poly = (pts, col) => { g.fillStyle = col; g.beginPath(); g.moveTo(...pts[0]); for (const p of pts.slice(1)) g.lineTo(...p); g.closePath(); g.fill(); };
  for (let pass = 0; pass < 2; pass++) {
    const off = pass === 0 ? [2.5 * px, -1.5 * px] : [0, 0];
    const col = pass === 0 ? "#ff4fb0" : "#10041f";
    const o = (p) => [p[0] + off[0], p[1] + off[1]];
    const segs = 18;
    for (let i = 0; i < segs; i++) {
      const t0 = i / segs, t1 = (i + 1) / segs;
      const p0 = bez(base, bend, top, t0), p1 = bez(base, bend, top, t1);
      const w0 = height * (0.045 + (0.024 - 0.045) * t0), w1 = height * (0.045 + (0.024 - 0.045) * t1) * 0.84;
      let d = [p1[0] - p0[0], p1[1] - p0[1]]; const dl = Math.hypot(...d); d = [d[0] / dl, d[1] / dl];
      const n = [-d[1], d[0]];
      poly([o([p0[0] + n[0] * w0, p0[1] + n[1] * w0]), o([p0[0] - n[0] * w0, p0[1] - n[1] * w0]),
        o([p1[0] - n[0] * w1, p1[1] - n[1] * w1]), o([p1[0] + n[0] * w1, p1[1] + n[1] * w1])], col);
    }
    const fronds = [-3.05, -2.6, -2.15, -1.75, -1.35, -0.95, -0.5, -0.08, 0.3];
    fronds.forEach((a, k) => {
      const length = height * (0.4 + 0.07 * Math.sin(k * 2.3));
      const dir = [Math.cos(a), Math.sin(a)];
      const tip = [top[0] + dir[0] * length, top[1] + dir[1] * length + height * (0.12 + 0.3 * Math.abs(dir[0]))];
      const mid = [top[0] + dir[0] * length * 0.55, top[1] + dir[1] * length * 0.55 - height * 0.06];
      const steps = 16; let prev = o(top);
      for (let i = 1; i <= steps; i++) {
        const t = i / steps; const p = o(bez(top, mid, tip, t));
        let d = [p[0] - prev[0], p[1] - prev[1]]; const dl = Math.hypot(...d) || 1; d = [d[0] / dl, d[1] / dl];
        let n = [-d[1], d[0]]; if (n[1] < 0) n = [-n[0], -n[1]];
        g.strokeStyle = col; g.lineWidth = Math.max(height * 0.01 * (1 - t * 0.6), 1.5 * px);
        g.beginPath(); g.moveTo(...prev); g.lineTo(...p); g.stroke();
        const leaf = Math.sin(Math.PI * Math.min(t * 1.25, 1)) * height * 0.085;
        for (const side of [-1, 1]) {
          let hg = [n[0] * side * 0.75 + d[0] * 0.35, n[1] * side * 0.75 + 0.85 + d[1] * 0.35];
          const hl = Math.hypot(...hg); hg = [hg[0] / hl * leaf, hg[1] / hl * leaf];
          const w = [(p[0] - prev[0]) * 0.55, (p[1] - prev[1]) * 0.55];
          poly([prev, p, [p[0] - w[0] * 0.2 + hg[0], p[1] - w[1] * 0.2 + hg[1]]], col);
        }
        prev = p;
      }
    });
    g.fillStyle = col; g.beginPath(); g.arc(...o(top), height * 0.03, 0, Math.PI * 2); g.fill();
  }
}

// --- The words: the chrome wordmark (title.gd + chrome.gdshader) and the card's line.
const NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("text");
svg.setAttribute("width", W); svg.setAttribute("height", H); svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
const el = (n, a, parent = svg) => { const e = document.createElementNS(NS, n); for (const k in a) e.setAttribute(k, a[k]); parent.appendChild(e); return e; };
const defs = el("defs", {});
let gradN = 0;
// chrome.gdshader by height between the capitals' top and the baseline: sky blue to white, a glint,
// a dark band, then warm metal to cream.
function chrome(top, bottom) {
  const id = "chrome" + gradN++;
  const g = el("linearGradient", { id, gradientUnits: "userSpaceOnUse", x1: 0, y1: top, x2: 0, y2: bottom }, defs);
  [[0, "rgb(89,158,255)"], [0.25, "rgb(190,215,255)"], [0.47, "rgb(247,250,255)"], [0.5, "#ffffff"],
   [0.505, "rgb(61,18,77)"], [0.6, "rgb(150,48,88)"], [0.78, "rgb(255,140,77)"], [1, "rgb(255,240,191)"]]
    .forEach(([o, c]) => el("stop", { offset: o, "stop-color": c }, g));
  return id;
}
function wordmark(lines, cx, y0, fs) {
  // y0: the first line's cap top. Open Sans caps are 0.714 em tall.
  const g = el("g", {});
  lines.forEach((word, i) => {
    const base = y0 + fs * 0.714 + i * fs * 0.98;
    const capTop = base - fs * 0.74;
    const tr = `translate(${cx} ${base}) skewX(-11.3) translate(${-cx} ${-base})`;
    const common = { x: cx, y: base, "text-anchor": "middle", "font-family": "Title Sans", "font-weight": 800,
      "font-size": fs, "letter-spacing": 2 * fs / 100, transform: tr, "paint-order": "stroke", "stroke-linejoin": "round" };
    el("text", { ...common, x: cx + fs * 0.06, y: base + fs * 0.08, fill: "#ff2fa0", stroke: "#ff2fa0", "stroke-width": fs * 0.11 }, g).textContent = word;
    el("text", { ...common, fill: `url(#${chrome(capTop, base)})`, stroke: "#2a0838", "stroke-width": fs * 0.11 }, g).textContent = word;
  });
  return g;
}
// The stylish mark: chrome block capitals forced to width w, the neon script word across their top.
function stylish(cx, y0, w, one = false) {
  if (!ST.script) {
    // Two chrome lines in the block face, each forced to width w.
    const g = el("g", {}), fs = w * 0.2;
    ["AROUND", "WARSAW"].forEach((word, i) => {
      const base = y0 + fs * 0.75 + i * fs * 1.12, capTop = base - fs * 0.75;
      const tr = `translate(${cx} ${base}) skewX(-10) translate(${-cx} ${-base})`;
      const common = { x: cx, y: base, "text-anchor": "middle", "font-family": ST.block, "font-weight": ST.weight,
        "font-size": fs, textLength: w, lengthAdjust: "spacingAndGlyphs", transform: tr, "paint-order": "stroke", "stroke-linejoin": "round" };
      el("text", { ...common, x: cx + fs * 0.05, y: base + fs * 0.07, fill: "#ff2fa0", stroke: "#ff2fa0", "stroke-width": fs * 0.1 }, g).textContent = word;
      el("text", { ...common, fill: `url(#${chrome(capTop, base)})`, stroke: "#2a0838", "stroke-width": fs * 0.09 }, g).textContent = word;
    });
    return g;
  }
  const g = el("g", {}), fs = w * 0.235, base = y0 + fs * 1.55, capTop = base - fs * 0.72;
  const tr = `translate(${cx} ${base}) skewX(-8) translate(${-cx} ${-base})`;
  const common = { x: cx, y: base, "text-anchor": "middle", "font-family": ST.block, "font-weight": ST.weight,
    "font-size": fs, textLength: w, lengthAdjust: "spacingAndGlyphs", transform: tr, "paint-order": "stroke", "stroke-linejoin": "round" };
  el("text", { ...common, x: cx + fs * 0.05, y: base + fs * 0.07, fill: "#ff2fa0", stroke: "#ff2fa0", "stroke-width": fs * 0.1 }, g).textContent = "WARSAW";
  el("text", { ...common, fill: `url(#${chrome(capTop, base)})`, stroke: "#2a0838", "stroke-width": fs * 0.08 }, g).textContent = "WARSAW";
  // A horizon glint across the chrome's middle.
  el("rect", { x: cx - w * 0.5, y: base - fs * 0.37, width: w, height: Math.max(2, fs * 0.012), fill: "#ffffff", opacity: 0.55, transform: tr }, g);
  // The neon script: a blurred pink glow, a hot pink tube and a white-pink core, tilted up.
  const id = "glow" + gradN++;
  const f = el("filter", { id, x: "-20%", y: "-40%", width: "140%", height: "180%" }, defs);
  el("feGaussianBlur", { stdDeviation: fs * 0.07 }, f);
  const sfs = fs * 1.05, sx = cx - w * 0.05, sy = capTop - fs * 0.06;
  const str = `rotate(-8 ${sx} ${sy})`;
  const sc = { x: sx, y: sy, "text-anchor": "middle", "font-family": ST.script, "font-size": sfs, transform: str,
    "stroke-linejoin": "round", "stroke-linecap": "round" };
  el("text", { ...sc, fill: "#ff2fd0", stroke: "#ff2fd0", "stroke-width": sfs * 0.06, filter: `url(#${id})` }, g).textContent = "Around";
  el("text", { ...sc, fill: "#14053a", stroke: "#14053a", "stroke-width": sfs * 0.09 }, g).textContent = "Around";
  el("text", { ...sc, fill: "#ff5ee0", stroke: "#ff5ee0", "stroke-width": sfs * 0.035 }, g).textContent = "Around";
  el("text", { ...sc, fill: "#ffe6fb" }, g).textContent = "Around";
  return g;
}
function mark(cx, y0, w, fsOld, oneLine = false) {
  if (P.get("style") === "open") return wordmark(oneLine ? ["AROUND WARSAW"] : ["AROUND", "WARSAW"], cx, y0, fsOld);
  return stylish(cx, y0, w);
}
function line(text, cx, y, fs, color, weight = 800) {
  return el("text", { x: cx, y, "text-anchor": "middle", "font-family": ST.ui, "font-weight": ST.ui === "Title Sans" ? weight : ST.uiWeight, "font-size": fs,
    fill: color, stroke: "#14053a", "stroke-width": fs * 0.16, "paint-order": "stroke", "stroke-linejoin": "round", "letter-spacing": fs * 0.06 });
}

let parts = {};
function layout() {
  const ios = document.getElementById("ios"), android = document.getElementById("android");
  if (MODE === "card") {
    parts.mark = mark(W / 2, H * 0.135, W * 0.8, W * 0.165);
    parts.tag = line("STAY TUNED", W / 2, H * 0.668, W * 0.085, "#7ff6ff");
    parts.tag.textContent = "STAY TUNED";
    parts.sub = line("Drive, fly and discover the real Warsaw", W / 2, H * 0.348, W * 0.037, "#7ff6ff", 600);
    parts.sub.setAttribute("letter-spacing", 0); parts.sub.textContent = "Drive, fly and discover the real Warsaw";
    const bw = 380, bh = 124, gap = 34, y = H * 0.69;
    for (const [b, x] of [[ios, W / 2 - gap / 2 - bw], [android, W / 2 + gap / 2]]) {
      b.style.left = x + "px"; b.style.top = y + "px"; b.style.width = bw + "px"; b.style.height = bh + "px";
    }
    android.style.borderColor = "#a4e86b";
  } else {
    ios.remove(); android.remove();
    if (MODE === "square") parts.mark = mark(W / 2, H * 0.08, W * 0.74, W * 0.15);
    if (MODE === "wordmark") parts.mark = mark(W / 2, H * 0.08, H * 2.3, W * 0.078, true);
    if (MODE === "wordmark2") parts.mark = mark(W / 2, H * 0.08, W * 0.78, W * 0.18);
  }
}

function frame(t) {
  if (gl) { gl.uniform1f(uTime, t); gl.drawArrays(gl.TRIANGLES, 0, 3); }
  if (MODE !== "card") return;
  // The card's entrance: the wordmark punches in on t = 0 (the music's hit), the tagline at 0.25 s,
  // STAY TUNED at 0.45 s, the store plates at 0.7 s; a still (t = 99) shows everything.
  const k = (a, b) => Math.min(1, Math.max(0, (t - a) / (b - a)));
  const back = (x) => 1 + 2.4 * Math.pow(x - 1, 3) + 1.4 * Math.pow(x - 1, 2);
  const km = k(0, 0.28), s = 0.8 + 0.2 * back(km);
  parts.mark.setAttribute("opacity", Math.min(1, km * 2.5));
  parts.mark.setAttribute("transform", `translate(${W / 2} ${H * 0.22}) scale(${s}) translate(${-W / 2} ${-H * 0.22})`);
  parts.sub.setAttribute("opacity", k(0.25, 0.45));
  const kt = k(0.45, 0.7);
  parts.tag.setAttribute("opacity", kt);
  parts.tag.setAttribute("letter-spacing", (W * 0.085) * (0.06 + 0.3 * (1 - kt)));
  for (const id of ["ios", "android"]) {
    const b = document.getElementById(id), kb = k(id === "ios" ? 0.7 : 0.8, id === "ios" ? 0.95 : 1.05);
    b.style.opacity = kb; b.style.transform = `translateY(${(1 - kb) * 40}px)`;
  }
}

layout();
drawPalm();
window.frame = frame;
frame(99);
</script>
