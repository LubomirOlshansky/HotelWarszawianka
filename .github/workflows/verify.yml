# The verification set on every push to main and every pull request, on Linux with the same Godot
# as the Mac (4.7.2). A pull request runs the checks its files can break (tools/ci_tier.py picks the
# tier from the changed paths; the steps of each group are in tools/ci_steps.txt); a push to main
# runs everything. The jobs:
#   tier   picks the tier and runs the Python checks every change gets (seconds).
#   quick  the check scripts that need no map (steering, settings, tiers, the HUD, police, ...).
#   map    the map pack (tools/map_pack.py: lod2.bin, lod2.json, terrain.json, a release asset,
#          since loop 3d-1 took them out of git), the derived split and prebuilt sectors
#          (tools/setup_map.sh, with a software Vulkan renderer under Xvfb), then the tier's map
#          steps in shards: the prebuilt city alone for a gameplay change, every shard for a map
#          change and on main.
#   gate   the one verdict: green when every job the tier asked for passed. "Green" means `gate`.
# Screenshots, the bench, the long autopilot runs and the phone stay on the Mac's tools/verify.sh
# (docs/WORKFLOW.md).
name: verify

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to a pull request replaces its older run. Pushes to main share one group without
# cancelling: one run goes on, the newest waits, and a push between them is dropped, since the
# waiting run is on a later commit that holds it. So ten merges in an hour cost two full runs,
# and the latest main always gets a verdict (2026-11-02: #261's red run went unseen when main
# runs cancelled each other; 2026-11-12: a full run per merge was about 4,000 runner minutes a day).
concurrency:
  group: verify-${{ github.event_name == 'push' && 'main' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GODOT_VERSION: 4.7.2

jobs:
  tier:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tier: ${{ steps.pick.outputs.tier }}
      quick: ${{ steps.pick.outputs.quick }}
      quick_steps: ${{ steps.pick.outputs.quick_steps }}
      map: ${{ steps.pick.outputs.map }}
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      # On a pull request this is the merge commit: its first parent is the base, so the diff
      # between the two is exactly what the pull request changes.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Pick the tier from the changed paths
        id: pick
        run: |
          python3 -I tools/ci_tier.py --selftest
          python3 -I tools/ci_tier.py --check
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            set -o pipefail
            git diff --name-only HEAD^1 HEAD | python3 -I tools/ci_tier.py --stdin --github-output | tee -a "$GITHUB_STEP_SUMMARY"
          else
            set -o pipefail
            python3 -I tools/ci_tier.py --full --github-output | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      # The checks that read the docs: every tier runs them here, so a docs-only change needs
      # no Godot and is done in under a minute.
      - name: Architecture map, landmark specs, change notes
        run: |
          python3 -I tools/check_architecture.py
          python3 -I tools/check_spec.py --selftest
          python3 -I tools/check_spec.py
          python3 -I tools/changelog.py --check

  quick:
    needs: tier
    if: needs.tier.outputs.quick == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install zsh (verify.sh is a zsh script)
        run: sudo apt-get update -q && sudo apt-get install -y -q zsh

      - name: Cache Godot
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux

      - name: Download Godot ${{ env.GODOT_VERSION }}
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          curl -sSfL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && rm godot.zip
          mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 godot && chmod +x godot

      # The steps that need no map: they read only what is committed (centrum.json, game/data).
      # The list is the `quick` group in tools/ci_steps.txt, one line per step.
      - name: tools/verify.sh, the steps that need no map
        env:
          GODOT: /home/runner/godot/godot
          NW_MAP_PACK: "off"   # the map job fetches and builds the map; this one stays map-free
        run: zsh tools/verify.sh --only=${{ needs.tier.outputs.quick_steps }} --logs="$RUNNER_TEMP/verify"

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-logs
          path: ${{ runner.temp }}/verify
          retention-days: 14

  # The tier's shards in parallel (tools/ci_tier.py). Two halves took 46-58 min (2026-11-11), most
  # of it the runtime city: four shards of 21-23 min of checks end in about 35.
  map:
    name: map (${{ matrix.part }})
    needs: tier
    if: needs.tier.outputs.map == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.tier.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      # zsh for the scripts, Xvfb and Mesa's lavapipe (software Vulkan): bake_city.gd needs a
      # renderer (--headless drops MultiMesh and texture data).
      - name: Install zsh, Xvfb and software Vulkan
        run: sudo apt-get update -q && sudo apt-get install -y -q zsh xvfb mesa-vulkan-drivers

      - name: Cache Godot
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux

      - name: Download Godot ${{ env.GODOT_VERSION }}
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          curl -sSfL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && rm godot.zip
          mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 godot && chmod +x godot

      - name: Cache the map pack
        uses: actions/cache@v4
        with:
          path: build/map-pack
          key: map-pack-${{ hashFiles('tools/map_pack.json') }}

      # Exit 3: the pack tools/map_pack.json names is not published yet (a new pack's PR, before
      # its release asset is up): the map checks are skipped with a warning instead of failing.
      # The repository is private since 2026-11-08: the release asset downloads through the API
      # with the job's token.
      - name: Fetch the map pack
        id: pack
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          python3 -I tools/map_pack.py fetch
          code=$?
          if [ $code -eq 3 ]; then
            echo "::warning title=Map pack not published::the map checks were skipped (tools/map_pack.py: publish the release asset)"
            echo "ready=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"; exit $code

      # The split and the prebuilt sectors from the last run whose inputs were the same; a stale
      # or missing set is rebuilt below (check_map_data.py --fresh compares the stamps).
      - name: Cache the derived map files
        if: steps.pack.outputs.ready == 'true'
        uses: actions/cache@v4
        with:
          path: |
            game/map/index.json
            game/map/index.res
            game/map/proxies.scn
            game/map/sectors
            game/map/shared
          key: map-derived-${{ hashFiles('tools/map_pack.json', 'game/map/*.json', 'game/map/*.bin', 'tools/bake_sectors.py', 'game/tools/bake_city.gd', 'game/scripts/**', 'game/shaders/**', 'game/data/courts.json') }}
          restore-keys: map-derived-

      - name: The split and the prebuilt sectors (tools/setup_map.sh)
        if: steps.pack.outputs.ready == 'true'
        env:
          GODOT: /home/runner/godot/godot
        run: |
          mkdir -p build
          xvfb-run -a -s "-screen 0 1280x720x24" zsh tools/setup_map.sh --if-needed || { tail -30 build/setup_map.log; exit 1; }

      - name: tools/verify.sh, the map steps
        if: steps.pack.outputs.ready == 'true'
        env:
          GODOT: /home/runner/godot/godot
        run: zsh tools/verify.sh --only=${{ matrix.steps }} --logs="$RUNNER_TEMP/verify-map"

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-map-logs-${{ strategy.job-index }}
          path: ${{ runner.temp }}/verify-map
          retention-days: 14
          if-no-files-found: ignore

  # The one check to wait for (and to require on main): it passes when every job the tier asked
  # for passed; a job the tier skipped counts as passed, a failed or cancelled one fails it.
  gate:
    needs: [tier, quick, map]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job of the "${{ needs.tier.outputs.tier }}" tier passed
        run: |
          echo "tier=${{ needs.tier.result }} quick=${{ needs.quick.result }} map=${{ needs.map.result }}"
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || needs.tier.result != 'success' }}" = "true" ]; then
            echo "::error::a job of the ${{ needs.tier.outputs.tier }} tier did not pass"
            exit 1
          fi
